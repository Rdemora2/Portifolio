name: CI Validations

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "devs" ]

jobs:
  build-and-lint:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Build
        run: npm run build
