services:
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "1"
      WATCHPACK_POLLING_INTERVAL: "1000"
      PORT: "3000"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-Portfolio <portfolio@example.com>}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-owner@example.com}
      CONTACT_IDEMPOTENCY_SECRET: ${CONTACT_IDEMPOTENCY_SECRET:-development-only-secret}
      CONTACT_ALLOWED_ORIGINS: ${CONTACT_ALLOWED_ORIGINS:-http://localhost:3000}
      CONTACT_TRUST_PROXY: "false"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: npm run dev -- -H 0.0.0.0 -p 3000
    init: true
    tty: true
    stdin_open: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  node_modules:
  next_cache:
