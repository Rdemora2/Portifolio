name: CI Validations

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "devs" ]

jobs:
  build-and-lint:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Build with Bundle Analysis
        run: ANALYZE=true npm run build

      - name: Upload Bundle Analysis
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea23f723f50446b8f1690f930 # v4.4.3
        if: always()
        with:
          name: bundle-analysis
          path: .next/analyze/
